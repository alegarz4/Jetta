<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mi Jetta App</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f80ed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Jetta">

  <style>
    :root{
      --bg1:#eaf4ff;
      --bg2:#f8fbff;
      --card:#ffffff;
      --text:#16324f;
      --muted:#5f7690;
      --line:#d7e6f5;
      --brand:#2f80ed;
      --brand-2:#56ccf2;
      --danger:#d64545;
      --warn:#f2a93b;
      --ok:#2d9b63;
      --shadow:0 12px 30px rgba(25,72,122,.12);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2));}
    body{min-height:100vh}
    .wrap{max-width:1200px;margin:0 auto;padding:18px}
    .hero,.card{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .hero{padding:22px;margin-bottom:18px}
    .hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(1.5rem,4vw,2.2rem)}
    .sub{margin-top:8px;color:var(--muted);line-height:1.45}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap}
    button{border:0;border-radius:16px;padding:12px 16px;font-weight:700;cursor:pointer;transition:.2s transform,.2s opacity,.2s background}
    button:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
    .btn-soft{background:#edf5ff;color:var(--text);border:1px solid var(--line)}
    .btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #f5caca}
    .btn-ok{background:#e8f8ef;color:var(--ok);border:1px solid #bce7cf}
    .msg{margin-top:12px;font-size:.95rem;color:var(--ok);font-weight:600;min-height:22px}
    .hidden-file{display:none}
    .tabs{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;margin-bottom:18px}
    .tab-btn{background:#fff;border:1px solid var(--line);color:var(--text);padding:12px 10px;border-radius:16px;font-weight:700}
    .tab-btn.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
    .tab{display:none}
    .tab.active{display:block}
    .grid{display:grid;gap:16px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{padding:18px}
    .wide-card{grid-column:span 2}
    .card h2{font-size:1.15rem;margin-bottom:14px}
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    label{font-weight:700;font-size:.95rem}
    input,textarea,select{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);font:inherit}
    textarea{min-height:96px;resize:vertical}
    .item-box{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fbfdff}
    .item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:999px;font-size:.82rem;font-weight:800}
    .badge.ok{background:#e8f8ef;color:var(--ok)}
    .badge.warn{background:#fff6df;color:#9a6900}
    .badge.danger{background:#ffe9e9;color:var(--danger)}
    .progress{height:9px;border-radius:999px;background:#eaf1f8;overflow:hidden;margin-top:10px}
    .progress > span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
    .check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .check-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:18px;padding:12px;background:#fbfdff}
    .check-card input{width:auto;margin-top:3px}
    .summary-box{border:1px solid var(--line);padding:14px;border-radius:18px;background:#fbfdff}
    .summary-box p{margin-top:6px;color:var(--muted)}
    .summary-big{font-size:1.8rem;font-weight:800;color:var(--text)}
    .chart{display:grid;gap:12px}
    .chart-row{display:grid;grid-template-columns:minmax(92px,140px) 1fr minmax(74px,max-content);gap:10px;align-items:center}
    .chart-label{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .chart-track{height:14px;border-radius:999px;background:#eaf1f8;overflow:hidden}
    .chart-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-2));min-width:3px}
    .chart-value{font-weight:800;text-align:right;font-size:.9rem}
    .insight-list{display:grid;gap:10px}
    .select-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .row-actions{display:flex;justify-content:flex-end;margin-top:10px}
    .muted{color:var(--muted)}
    .section-spacer{margin-top:18px}
    .footer-note{font-size:.85rem;color:var(--muted);margin-top:10px;line-height:1.45}
    @media (max-width: 980px){
      .tabs{grid-template-columns:repeat(3,1fr)}
      .grid-4,.grid-3,.grid-2,.field-grid,.check-grid,.select-row{grid-template-columns:1fr}
      .wide-card{grid-column:1}
    }
    @media (max-width: 640px){
      .wrap{padding:12px}
      .hero,.card{border-radius:18px}
      .tabs{grid-template-columns:repeat(2,1fr)}
      button{width:100%}
      .btn-row{width:100%}
      .btn-row button{flex:1 1 100%}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1>🚗 Mi Jetta App</h1>
          <p class="sub">Bitácora completa para mantenimiento, gasolina, gastos, fallas y control general de tu Jetta Clásico.</p>
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="saveAll()">Guardar</button>
          <button class="btn-soft" onclick="loadAll()">Cargar</button>
          <button class="btn-ok" onclick="exportData()">Respaldar</button>
          <button class="btn-soft" onclick="document.getElementById('importFile').click()">Importar</button>
          <button class="btn-danger" onclick="clearAll()">Reiniciar</button>
        </div>
      </div>
      <div id="saveMessage" class="msg"></div>
      <input id="importFile" class="hidden-file" type="file" accept="application/json,.json" onchange="importData(event)">
    </section>

    <section class="tabs">
      <button class="tab-btn active" data-tab="perfil">Perfil</button>
      <button class="tab-btn" data-tab="mantenimiento">Mantenimiento</button>
      <button class="tab-btn" data-tab="historial">Historial</button>
      <button class="tab-btn" data-tab="gasolina">Gasolina</button>
      <button class="tab-btn" data-tab="gastos">Gastos</button>
      <button class="tab-btn" data-tab="diagnostico">Diagnóstico</button>
      <button class="tab-btn" data-tab="sonidos">Sonidos</button>
      <button class="tab-btn" data-tab="graficas">Gráficas</button>
      <button class="tab-btn" data-tab="resumen">Resumen</button>
    </section>

    <section id="perfil" class="tab active"></section>
    <section id="mantenimiento" class="tab"></section>
    <section id="historial" class="tab"></section>
    <section id="gasolina" class="tab"></section>
    <section id="gastos" class="tab"></section>
    <section id="diagnostico" class="tab"></section>
    <section id="sonidos" class="tab"></section>
    <section id="graficas" class="tab"></section>
    <section id="resumen" class="tab"></section>
  </div>

  <script>
    const STORAGE_KEY = 'mi-jetta-app-html';

    const initialState = {
      vehicle: {
        nombre: 'Mi Jetta Clásico 2001',
        modelo: 'Volkswagen Jetta Clásico',
        anio: '2001',
        motor: '2.0',
        placas: '',
        kilometrajeActual: 186431,
        combustibleTipo: 'Gasolina',
        notas: ''
      },
      service: {
        ultimoAceiteKm: 183000,
        proximoAceiteKm: 188000,
        ultimoAfinacionKm: 180000,
        proximaAfinacionKm: 190000,
        ultimoFrenosKm: 178000,
        proximoFrenosKm: 193000,
        ultimoAnticongelanteKm: 182000,
        proximoAnticongelanteKm: 202000,
        ultimoBandaKm: 175000,
        proximaBandaKm: 205000
      },
      fuelLog: [],
      issueInput: {
        luzTemperaturaParpadea: false,
        luzTemperaturaFija: false,
        agujaNormal: true,
        ventiladoresFuncionan: true,
        nivelAnticongelanteOk: true,
        fugaVisible: false,
        dificultadEncender: false,
        jalonea: false,
        humoEscape: false,
        checkEngine: false,
        notas: ''
      },
      soundInput: {
        tipo: '',
        momento: '',
        zona: '',
        cambiaCon: '',
        intensidad: 'Media',
        notas: ''
      },
      serviceHistory: [
        { fecha: '', kilometraje: '', tipo: 'Cambio de aceite', costo: '', taller: '', notas: '' }
      ],
      failureLog: [
        { fecha: '', kilometraje: '', falla: '', sintomas: '', accion: '', resuelto: false }
      ],
      expenseLog: []
    };

    let state = cloneData(initialState);

    function money(value){
      return new Intl.NumberFormat('es-MX', {
        style: 'currency',
        currency: 'MXN'
      }).format(Number(value || 0));
    }

    function cloneData(data){
      return JSON.parse(JSON.stringify(data));
    }

    function mergeState(base, saved){
      const output = cloneData(base);
      Object.keys(saved || {}).forEach(key => {
        if (
          saved[key] &&
          !Array.isArray(saved[key]) &&
          typeof saved[key] === 'object' &&
          output[key] &&
          !Array.isArray(output[key])
        ) {
          output[key] = { ...output[key], ...saved[key] };
        } else {
          output[key] = saved[key];
        }
      });
      return output;
    }

    function notify(text, ok = true){
      const box = document.getElementById('saveMessage');
      box.textContent = text;
      box.style.color = ok ? 'var(--ok)' : 'var(--danger)';
      setTimeout(() => { box.textContent = ''; }, 2500);
    }

    function persist(showMessage = false){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(showMessage) notify('Datos guardados correctamente.');
    }

    function today(){
      return new Date().toISOString().slice(0,10);
    }

    function kmRemaining(currentKm, nextKm){
      return Number(nextKm || 0) - Number(currentKm || 0);
    }

    function getStatus(diff){
      if (diff <= 0) return {label:'Vencido', className:'danger', progress:100};
      if (diff <= 500) return {label:'Urgente', className:'danger', progress:90};
      if (diff <= 1500) return {label:'Próximo', className:'warn', progress:65};
      return {label:'Bien', className:'ok', progress:30};
    }

    function getServiceCards(){
      const currentKm = Number(state.vehicle.kilometrajeActual || 0);
      return [
        { nombre:'Aceite', next: state.service.proximoAceiteKm },
        { nombre:'Afinación', next: state.service.proximaAfinacionKm },
        { nombre:'Frenos', next: state.service.proximoFrenosKm },
        { nombre:'Anticongelante', next: state.service.proximoAnticongelanteKm },
        { nombre:'Banda / accesorios', next: state.service.proximaBandaKm }
      ].map(item => {
        const diff = kmRemaining(currentKm, item.next);
        return { ...item, diff, status: getStatus(diff) };
      });
    }

    function getFuelSummary(){
  const registros = state.fuelLog
    .map(r => ({
      fecha: r.fecha,
      km: Number(r.km || 0),
      litros: Number(r.litros || 0),
      costo: Number(r.costo || 0)
    }))
    .filter(r => r.km > 0 && r.litros > 0)
    .sort((a,b) => a.km - b.km);

  const totalLitros = registros.reduce((a,b) => a + b.litros, 0);
  const totalCosto = registros.reduce((a,b) => a + b.costo, 0);
  const kmRecorridos = registros.length >= 2 ? registros[registros.length - 1].km - registros[0].km : 0;
  const litrosConsumidos = registros.slice(1).reduce((a,b) => a + b.litros, 0);
  const costoConsumido = registros.slice(1).reduce((a,b) => a + b.costo, 0);
  const kmPorLitro = litrosConsumidos > 0 ? kmRecorridos / litrosConsumidos : 0;
  const costoPorKm = kmRecorridos > 0 ? costoConsumido / kmRecorridos : 0;

  return { totalLitros, totalCosto, kmRecorridos, kmPorLitro, costoPorKm };
}

function getFuelPerformance(){

  const registros = state.fuelLog
    .map(r => ({
      fecha: r.fecha,
      km: Number(r.km || 0),
      litros: Number(r.litros || 0)
    }))
    .filter(r => r.km > 0 && r.litros > 0)
    .sort((a,b) => a.km - b.km);

  const rendimientos = [];

  for(let i=1;i<registros.length;i++){

    const kmRecorridos = registros[i].km - registros[i-1].km;
    const litros = registros[i].litros;

    if(kmRecorridos > 0 && litros > 0){
      rendimientos.push({
        fecha: registros[i].fecha || "Sin fecha",
        kmPorLitro: kmRecorridos / litros
      });
    }

  }

  if(!rendimientos.length){
    return {lista:[], promedio:0, mejor:0, peor:0};
  }

  const valores = rendimientos.map(r=>r.kmPorLitro);
  const promedio = valores.reduce((a,b)=>a+b,0)/valores.length;

  return {
    lista:rendimientos,
    promedio,
    mejor:Math.max(...valores),
    peor:Math.min(...valores)
  };

}

    function getExpenseSummary(){
      const total = state.expenseLog.reduce((acc, item) => acc + Number(item.monto || 0), 0);
      const grouped = {};
      state.expenseLog.forEach(item => {
        const key = item.categoria || 'Otros';
        grouped[key] = (grouped[key] || 0) + Number(item.monto || 0);
      });
      return { total, grouped };
    }

    function getMonthlyExpenses(){
      const grouped = {};
      state.expenseLog.forEach(item => {
        const amount = Number(item.monto || 0);
        if(!amount) return;
        const month = (item.fecha || '').slice(0,7) || 'Sin fecha';
        grouped[month] = (grouped[month] || 0) + amount;
      });
      return Object.entries(grouped)
        .sort(([a],[b]) => a.localeCompare(b))
        .slice(-12)
        .map(([label,value]) => ({ label, value }));
    }

    function getExpenseByCategory(){
      return Object.entries(getExpenseSummary().grouped)
        .sort((a,b) => b[1] - a[1])
        .map(([label,value]) => ({ label, value }));
    }

    function getFuelChartData(){
      return getFuelPerformance().lista.slice(-12).map(item => ({
        label: item.fecha,
        value: item.kmPorLitro
      }));
    }

    function getFuelInsights(){
      const perf = getFuelPerformance();
      const insights = [];
      if(perf.lista.length < 2){
        return ['Registra al menos dos cargas consecutivas para ver tendencias reales de consumo.'];
      }
      const last = perf.lista[perf.lista.length - 1].kmPorLitro;
      const avg = perf.promedio;
      if(last < avg * 0.85) insights.push('El último rendimiento está notablemente debajo del promedio. Revisa presión de llantas, filtro de aire, bujías y hábitos de manejo.');
      if(last > avg * 1.15) insights.push('El último rendimiento salió mejor que el promedio. Puede haber influido manejo más constante o carretera.');
      if(perf.peor > 0 && perf.mejor / perf.peor > 1.35) insights.push('Hay mucha variación entre el mejor y peor rendimiento. Conviene anotar tráfico, clima, carretera y carga del auto.');
      if(!insights.length) insights.push('El rendimiento se ve estable con los datos actuales.');
      return insights;
    }

    function diagnoseSound(data){
      const results = [];
      const tipo = data.tipo;
      const momento = data.momento;
      const zona = data.zona;
      const cambiaCon = data.cambiaCon;

      if(tipo === 'Chillido' && momento === 'Al frenar') {
        results.push({ titulo:'Balatas o discos de freno', nivel:'Alta probabilidad', detalle:'Chillido al frenar suele venir de balatas cristalizadas, desgaste, polvo, discos rayados o sensor de desgaste.' });
      }
      if(tipo === 'Golpe seco' && (momento === 'Al pasar baches' || zona === 'Suspensión')) {
        results.push({ titulo:'Suspensión o dirección', nivel:'Alta probabilidad', detalle:'Revisa bujes, rótulas, bieletas, bases de amortiguador y tornillería de suspensión.' });
      }
      if(tipo === 'Cascabeleo' && (momento === 'Al acelerar' || cambiaCon === 'RPM')) {
        results.push({ titulo:'Detonación o encendido', nivel:'Revisión recomendada', detalle:'Puede relacionarse con gasolina, bujías, cables, sensor knock, mezcla pobre o tiempo de encendido.' });
      }
      if(tipo === 'Zumbido' && cambiaCon === 'Velocidad') {
        results.push({ titulo:'Balero de rueda o llanta', nivel:'Media alta', detalle:'Si el zumbido aumenta con la velocidad, revisa baleros, desgaste irregular de llantas y alineación.' });
      }
      if(tipo === 'Rechinido' && (momento === 'Al girar' || zona === 'Dirección')) {
        results.push({ titulo:'Dirección, banda o suspensión delantera', nivel:'Media', detalle:'Puede ser banda, bomba de dirección, terminales, rótulas o bujes trabajando en seco.' });
      }
      if(tipo === 'Traqueteo' && (momento === 'En ralentí' || zona === 'Motor')) {
        results.push({ titulo:'Soportes, poleas o componentes sueltos', nivel:'Media', detalle:'Revisa soportes de motor, poleas, banda, tensor, escape suelto y tapas o tolvas vibrando.' });
      }
      if(tipo === 'Silbido' && zona === 'Motor') {
        results.push({ titulo:'Fuga de vacío o banda', nivel:'Media', detalle:'Un silbido en motor puede venir de mangueras de vacío, admisión, banda, polea o fuga en múltiple.' });
      }
      if(data.intensidad === 'Alta') {
        results.push({ titulo:'Atención prioritaria', nivel:'Alta', detalle:'Si el sonido es fuerte, nuevo o empeora rápido, evita trayectos largos hasta revisarlo.' });
      }
      if(!results.length){
        results.push({ titulo:'Sin patrón claro', nivel:'Observación', detalle:'Agrega cuándo aparece, de dónde viene y si cambia con velocidad o RPM para mejorar la orientación.' });
      }
      return results;
    }

    function diagnoseIssue(data){
      const results = [];
      if (data.luzTemperaturaParpadea && data.agujaNormal && data.ventiladoresFuncionan && data.nivelAnticongelanteOk) {
        results.push({ titulo:'Sensor o conector del depósito de anticongelante', nivel:'Alta probabilidad', detalle:'Si la luz roja parpadea, la aguja está normal y los ventiladores sí funcionan, en Jetta A4 suele ser sensor de nivel, conector flojo o clip roto en el depósito.' });
      }
      if (data.luzTemperaturaFija && !data.agujaNormal) {
        results.push({ titulo:'Posible sobrecalentamiento real', nivel:'Atención inmediata', detalle:'Si la luz queda fija y la aguja sube, hay que revisar termostato, bomba de agua, radiador, nivel real y circulación del refrigerante.' });
      }
      if (data.dificultadEncender || data.jalonea) {
        results.push({ titulo:'Revisar afinación básica', nivel:'Media probabilidad', detalle:'Puede convenir revisar bujías, cables, filtro de aire, cuerpo de aceleración y sensor de temperatura del refrigerante.' });
      }
      if (data.checkEngine) {
        results.push({ titulo:'Escaneo OBD recomendado', nivel:'Recomendado', detalle:'La luz Check Engine necesita lectura con escáner para confirmar códigos antes de cambiar piezas.' });
      }
      if (data.fugaVisible) {
        results.push({ titulo:'Fuga en sistema de enfriamiento', nivel:'Alta prioridad', detalle:'Si hay fuga visible, revisa depósito, mangueras, radiador, abrazaderas y sensor de temperatura.' });
      }
      if (!results.length) {
        results.push({ titulo:'Sin patrón claro por ahora', nivel:'Observación', detalle:'Captura más datos del síntoma, kilometraje y cuándo ocurre. Con más historial el diagnóstico será más preciso.' });
      }
      return results;
    }

    function getPendingAlerts(){
      const alerts = getServiceCards()
        .filter(item => item.status.label !== 'Bien')
        .map(item => `${item.nombre}: ${item.status.label} (${item.diff} km)`);
      state.failureLog.filter(item => !item.resuelto && (item.falla || '').trim()).forEach(item => {
        alerts.push(`Falla pendiente: ${item.falla}`);
      });
      return alerts.length ? alerts : ['Sin alertas activas por ahora.'];
    }

    function setByPath(path, value){
      const parts = path.split('.');
      let ref = state;
      for(let i=0;i<parts.length-1;i++) ref = ref[parts[i]];
      ref[parts[parts.length-1]] = value;
      persist();
      renderAll();
    }

    function setArrayValue(arrName, index, key, value){
  state[arrName][index][key] = value;
  persist();
  renderAll();
}

    function addItem(arrName, item){
  state[arrName].push(item);
  persist();
  renderAll();
}

    function removeItem(arrName, index){
  if(!confirm('¿Eliminar este registro?')) return;
  state[arrName].splice(index,1);
  persist();
  renderAll();
}

    function saveAll(){
      persist(true);
    }

    function loadAll(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){ notify('No hay datos guardados todavía.', false); return; }
      try{
        state = mergeState(initialState, JSON.parse(raw));
        renderAll();
        notify('Datos cargados correctamente.');
      }catch(e){
        notify('No se pudieron cargar los datos.', false);
      }
    }

    function clearAll(){
      if(!confirm('¿Seguro que quieres reiniciar la app? Se borrarán los datos guardados en este navegador.')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = cloneData(initialState);
      renderAll();
      notify('Datos reiniciados.');
    }

    function exportData(){
      persist();
      const backup = {
        app: 'Mi Jetta App',
        version: 2,
        exportado: new Date().toISOString(),
        state
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `mi-jetta-respaldo-${date}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      notify('Respaldo descargado.');
    }

    function importData(event){
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);
          const incomingState = parsed.state || parsed;
          state = mergeState(initialState, incomingState);
          persist();
          renderAll();
          notify('Respaldo importado correctamente.');
        }catch(e){
          notify('No se pudo importar el respaldo.', false);
        }
      };
      reader.readAsText(file);
    }

    function inputField(label, path, value, type='text'){
      const numberAttrs = type === 'number' ? ' min="0" step="any" inputmode="decimal"' : '';
      return `<div class="field"><label>${label}</label><input type="${type}"${numberAttrs} value="${escapeAttr(value)}" onchange="setByPath('${path}', this.value)"></div>`;
    }

    function arrayInputField(arrName,index,key,label,value,type='text'){
      const numberAttrs = type === 'number' ? ' min="0" step="any" inputmode="decimal"' : '';
      return `<div class="field"><label>${label}</label><input type="${type}"${numberAttrs} value="${escapeAttr(value)}" onchange="setArrayValue('${arrName}',${index},'${key}',this.value)"></div>`;
    }

    function expenseCategoryField(index, value){
      const categories = ['Gasolina','Mantenimiento','Refacciones','Verificación','Seguro','Estacionamiento','Lavado','Otros'];
      const current = value || 'Otros';
      const options = categories.map(category => `
        <option value="${escapeAttr(category)}" ${current === category ? 'selected' : ''}>${escapeHtml(category)}</option>
      `).join('');
      return `<div class="field"><label>Categoría</label><select onchange="setArrayValue('expenseLog',${index},'categoria',this.value)">${options}</select></div>`;
    }

    function selectField(label, path, value, options){
      const html = options.map(option => {
        const text = option || 'Selecciona';
        return `<option value="${escapeAttr(option)}" ${value === option ? 'selected' : ''}>${escapeHtml(text)}</option>`;
      }).join('');
      return `<div class="field"><label>${label}</label><select onchange="setByPath('${path}', this.value)">${html}</select></div>`;
    }

    function barChart(items, suffix = '', isMoney = false){
      const valid = items.filter(item => Number(item.value) > 0);
      if(!valid.length) return '<p class="muted">Aún no hay datos suficientes para graficar.</p>';
      const max = Math.max(...valid.map(item => Number(item.value)));
      return `<div class="chart">${valid.map(item => {
        const value = Number(item.value);
        const width = Math.max(4, Math.round((value / max) * 100));
        const display = isMoney ? money(value) : `${value.toFixed(2)} ${suffix}`;
        return `
          <div class="chart-row">
            <div class="chart-label" title="${escapeAttr(item.label)}">${escapeHtml(item.label)}</div>
            <div class="chart-track"><div class="chart-bar" style="width:${width}%"></div></div>
            <div class="chart-value">${escapeHtml(display)}</div>
          </div>`;
      }).join('')}</div>`;
    }

    function escapeHtml(str){
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function escapeAttr(str){
      return escapeHtml(str).replace(/"/g,'&quot;');
    }

      renderPerfil();
      renderMantenimiento();
      renderHistorial();
      renderGasolina();
      renderGastos();
      renderDiagnostico();
      renderSonidos();

    function initApp(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        try{
          state = mergeState(initialState, JSON.parse(raw));
        }catch(e){
          notify('No se pudieron cargar los datos guardados.', false);
        }
      }

      renderAll();

      if('serviceWorker' in navigator && location.protocol !== 'file:'){
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    initApp();
  </script>
